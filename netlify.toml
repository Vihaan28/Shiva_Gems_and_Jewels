[build]
  publish = "."
  command = "node scripts/build-data.js"

# Keeps old product-detail URLs working if you ever rename/remove a
# static product page — harmless if unused.
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
